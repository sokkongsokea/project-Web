<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sporting Store Global - Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta http-equiv="refresh" content="3;url=homepage.html" />
    <script>
      tailwind.config = {
        theme: { extend: { colors: { primary: "#e63946" } } },
      };
    </script>
  </head>
  <body
    class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-6 font-sans"
  >
    <div class="text-center space-y-8 max-w-lg">
      <div class="relative inline-block animate-pulse">
        <span class="text-4xl md:text-6xl font-black text-primary italic"
          >Sporting</span
        >
        <span class="text-4xl md:text-6xl font-black">Store</span>
        <div
          class="absolute -top-4 -right-4 w-8 h-8 bg-primary rounded-full blur-xl opacity-50"
        ></div>
      </div>

      <div class="space-y-4">
        <h1 class="text-xl font-black uppercase tracking-[0.4em] italic">
          The Future of Sport
        </h1>
        <p class="text-slate-400 font-medium leading-relaxed">
          Preparing your elite performance experience. You are being redirected
          to our global flagship.
        </p>
      </div>

      <div class="flex items-center justify-center gap-4">
        <div
          class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-delay:-0.3s]"
        ></div>
        <div
          class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce [animation-delay:-0.15s]"
        ></div>
        <div class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce"></div>
      </div>

      <div class="pt-8">
        <a
          href="homepage.html"
          class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-primary transition-all border-b border-slate-800 hover:border-primary pb-1"
          >Enter Flagship Store Now</a
        >
      </div>
    </div>
  </body>
</html>
