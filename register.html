<!doctype html>
<html
  lang="en"
  x-data="{ darkMode: localStorage.getItem('theme') === 'dark' }"
  :class="{ 'dark': darkMode }"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sporting Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e63946",
            },
          },
        },
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300 flex items-center justify-center min-h-screen p-6"
  >
    <!-- Theme Toggle -->
    <button
      @click="darkMode = !darkMode; localStorage.setItem('theme', darkMode ? 'dark' : 'light')"
      class="fixed top-6 right-6 p-3 rounded-full bg-white dark:bg-slate-800 shadow-xl text-slate-600 dark:text-yellow-300 transition-all hover:scale-110"
    >
      <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
    </button>

    <div
      class="bg-white dark:bg-slate-800 p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-lg border border-gray-100 dark:border-slate-700 relative overflow-hidden transition-colors"
    >
      <div
        class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-600 via-pink-500 to-red-500"
      ></div>

      <div class="text-center mb-10">
        <h1 class="text-3xl font-black dark:text-white mb-2 italic">
          Create you Account
        </h1>
        <p class="text-slate-500 dark:text-slate-400 font-medium">
          Join our community of happy families!
        </p>
      </div>

      <form action="#" class="space-y-6">
        <div class="space-y-2">
          <label
            class="block text-xs font-black uppercase tracking-widest ml-1 dark:text-slate-400"
            >Your Name</label
          >
          <input
            type="text"
            class="w-full p-4 bg-slate-50 dark:bg-slate-900 border-none rounded-2xl text-sm focus:ring-4 focus:ring-purple-500/20 outline-none transition-all dark:text-white font-bold"
            placeholder="Put your Name"
            required
          />
        </div>
        <div class="space-y-2">
          <label
            class="block text-xs font-black uppercase tracking-widest ml-1 dark:text-slate-400"
            >Email</label
          >
          <input
            type="email"
            class="w-full p-4 bg-slate-50 dark:bg-slate-900 border-none rounded-2xl text-sm focus:ring-4 focus:ring-purple-500/20 outline-none transition-all dark:text-white font-bold"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="space-y-2">
          <label
            class="block text-xs font-black uppercase tracking-widest ml-1 dark:text-slate-400"
            >password</label
          >
          <input
            type="password"
            class="w-full p-4 bg-slate-50 dark:bg-slate-900 border-none rounded-2xl text-sm focus:ring-4 focus:ring-purple-500/20 outline-none transition-all dark:text-white font-bold"
            placeholder="••••••••"
            required
          />
        </div>
        <div class="space-y-2">
          <label
            class="block text-xs font-black uppercase tracking-widest ml-1 dark:text-slate-400"
            >comform password</label
          >
          <input
            type="password"
            class="w-full p-4 bg-slate-50 dark:bg-slate-900 border-none rounded-2xl text-sm focus:ring-4 focus:ring-purple-500/20 outline-none transition-all dark:text-white font-bold"
            placeholder="••••••••"
            required
          />
        </div>

        <button
          type="submit"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-purple-600/30 transition-all transform hover:-translate-y-1"
        >
          Register NOw
        </button>
      </form>

      <div
        class="mt-8 text-center border-t border-gray-100 dark:border-slate-700 pt-8"
      >
        <a
          href="index.html"
          class="inline-flex items-center gap-2 text-sm font-black text-purple-600 hover:text-purple-500 transition-colors uppercase tracking-widest"
        >
          <i class="fas fa-arrow-left text-xs"></i>
          <span>Back Home</span>
        </a>
      </div>
    </div>
  </body>
</html>
